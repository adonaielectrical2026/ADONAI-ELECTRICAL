# Cómo se arma el sitio que se publica.
#
# La app vive en codigo/ (index.html + app.js + estilos.css + iconos). Además
# está app-completa.html, que es la misma app en un solo archivo para abrir sin
# internet, y que vive en la raíz del proyecto.
#
# Netlify publica una sola carpeta, así que se junta todo en _publicar/: el
# contenido de codigo/ en la raíz del sitio, y app-completa.html al lado, para
# que un técnico lo pueda descargar desde el sitio en vez de pedirlo por
# WhatsApp.
#
# Este archivo sirve para las dos formas de publicar:
#   - a mano:      netlify deploy --prod --build
#   - automático:  cada push a main, si se conecta el repo desde el panel

[build]
  publish = "_publicar"
  command = "rm -rf _publicar && mkdir _publicar && cp -R codigo/. _publicar/ && cp app-completa.html _publicar/"
